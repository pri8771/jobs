[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-automation"
version = "0.1.0"
description = "Portable personal job-search automation system"
authors = [
    { name = "Priyansh Chordia", email = "priyansh.chordia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "click>=8.1.7",
    "rich>=13.7.0",
    "beautifulsoup4>=4.12.0",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "jsonschema>=4.21.0",
    # Executed JSON Schema format assertions for the real-proof verifier (date-time, uri).
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-beautifulsoup4>=4.12.0",
    "types-jsonschema>=4.21.0",
]

[project.scripts]
jobs-automation = "jobs_automation.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "google.oauth2.*",
    "google.auth.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jobs_automation.adapters.gmail"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
