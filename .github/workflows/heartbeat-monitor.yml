name: Worker Heartbeat Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check worker heartbeat freshness
        uses: actions/github-script@v7
        with:
          script: |
            const lanes = [
              {lane: 'A', branch: 'worker/v15-assisted-application', path: 'coordination/heartbeats/LANE_A.md'},
              {lane: 'B', branch: 'worker/recruiting-ops', path: 'coordination/heartbeats/LANE_B.md'},
              {lane: 'C', branch: 'worker/live-data-foundations', path: 'coordination/heartbeats/LANE_C.md'},
              {lane: 'D', branch: 'worker/v23-foundations', path: 'coordination/heartbeats/LANE_D.md'},
              {lane: 'SCOUT', branch: 'scout/qa-prep', path: 'coordination/heartbeats/SCOUT.md'},
            ];

            function value(text, key) {
              const m = text.match(new RegExp('^' + key + ':\\s*(.*)$', 'm'));
              return m ? m[1].trim() : null;
            }

            const rows = [];
            let unhealthy = false;
            const now = Date.now();

            for (const lane of lanes) {
              let text = '';
              try {
                const res = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: lane.path,
                  ref: lane.branch,
                });
                text = Buffer.from(res.data.content, 'base64').toString('utf8');
              } catch (err) {
                rows.push([lane.lane, lane.branch, 'MISSING', '-', '-', 'missing heartbeat file']);
                unhealthy = true;
                continue;
              }

              const mode = value(text, 'mode') || 'UNKNOWN';
              const streak = value(text, 'consecutive_on_time') || '0';
              const last = value(text, 'last_check_in_utc');
              const review = value(text, 'review_state') || 'UNKNOWN';

              if (!last || last === 'null') {
                rows.push([lane.lane, lane.branch, mode, streak, review, 'no worker-authored heartbeat yet']);
                unhealthy = true;
                continue;
              }

              const lastMs = Date.parse(last);
              const ageMin = Number.isFinite(lastMs) ? (now - lastMs) / 60000 : Infinity;
              const staleLimit = mode === 'STEADY_HOURLY' ? 75 : 20;
              const state = ageMin <= staleLimit ? 'fresh' : 'STALE';
              if (state === 'STALE') unhealthy = true;

              rows.push([
                lane.lane,
                lane.branch,
                mode,
                streak,
                review,
                state + ' (' + ageMin.toFixed(1) + 'm old)'
              ]);
            }

            let summary = '## Worker heartbeat monitor\n\n';
            summary += '| Lane | Branch | Mode | Streak | Review | Freshness |\n';
            summary += '|---|---|---|---:|---|---|\n';
            for (const r of rows) {
              summary += '| ' + r.join(' | ') + ' |\n';
            }
            summary += '\nMonitor cadence: GitHub schedule every 15 minutes. ChatGPT scheduled lead review remains hourly.\n';

            await core.summary.addRaw(summary).write();

            if (unhealthy) {
              core.setFailed('One or more worker heartbeat lanes are missing, unproven, or stale.');
            }
