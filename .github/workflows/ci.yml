name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs_ci
          POSTGRES_USER: jobs_ci
          POSTGRES_PASSWORD: jobs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs_ci -d jobs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy Typechecker
        run: |
          mypy src tests

      - name: Verify Alembic migration chain
        env:
          DATABASE_URL: postgresql+psycopg://jobs_ci:jobs_ci@localhost:5432/jobs_ci
        run: |
          bash scripts/verify_migrations.sh

      - name: Run Pytest
        run: |
          pytest -v
