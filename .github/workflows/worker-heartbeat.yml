name: Worker Heartbeat Validation

on:
  push:
    branches:
      - 'worker/v14-real-proof'
      - 'worker/v15-assisted-application'
      - 'worker/recruiting-ops'
    paths:
      - 'coordination/heartbeats/LANE_1.md'
      - 'coordination/heartbeats/LANE_2.md'
      - 'coordination/heartbeats/LANE_3.md'
  workflow_dispatch:

jobs:
  validate-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate active 5-minute heartbeat
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            worker/v14-real-proof) file="coordination/heartbeats/LANE_1.md" ;;
            worker/v15-assisted-application) file="coordination/heartbeats/LANE_2.md" ;;
            worker/recruiting-ops) file="coordination/heartbeats/LANE_3.md" ;;
            *) exit 0 ;;
          esac

          for key in lane branch heartbeat_epoch mode interval_minutes heartbeat_count last_check_in_utc current_task progress_note review_state lead_action_requested; do
            grep -Eq "^$key:[[:space:]]*" "$file" || {
              echo "ERROR: missing $key" >&2
              exit 1
            }
          done

          epoch="$(sed -n 's/^heartbeat_epoch:[[:space:]]*//p' "$file" | head -n1 | tr -d '\r')"
          mode="$(sed -n 's/^mode:[[:space:]]*//p' "$file" | head -n1 | tr -d '\r')"
          interval="$(sed -n 's/^interval_minutes:[[:space:]]*//p' "$file" | head -n1 | tr -d '\r')"
          count="$(sed -n 's/^heartbeat_count:[[:space:]]*//p' "$file" | head -n1 | tr -d '\r')"
          review="$(sed -n 's/^review_state:[[:space:]]*//p' "$file" | head -n1 | tr -d '\r')"
          action="$(sed -n 's/^lead_action_requested:[[:space:]]*//p' "$file" | head -n1 | tr -d '\r')"

          [ "$epoch" = "FIVE_MIN_2026_09_21" ] || { echo "ERROR: wrong epoch $epoch" >&2; exit 1; }
          [ "$mode" = "ACTIVE_5M" ] || { echo "ERROR: mode must be ACTIVE_5M" >&2; exit 1; }
          [ "$interval" = "5" ] || { echo "ERROR: interval must be 5" >&2; exit 1; }
          [[ "$count" =~ ^[0-9]+$ ]] || { echo "ERROR: heartbeat_count must be integer" >&2; exit 1; }

          case "$review" in WORKING|READY_FOR_LEAD_REVIEW|BLOCKED) ;; *) exit 1 ;; esac
          case "$action" in NONE|REVIEW|DECOMPOSE|ARCHITECTURE_DECISION|USER_ACTION) ;; *) exit 1 ;; esac

          echo "$file: valid ACTIVE_5M heartbeat"
