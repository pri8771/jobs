services:
  postgres:
    image: postgres:16-alpine
    container_name: jobs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  jobs-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobs_dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://jobs:jobs@postgres:5432/jobs
      CONFIG_DIR: config
    ports:
      - "8765:8765"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  jobs-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobs_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://jobs:jobs@postgres:5432/jobs
      CONFIG_DIR: config
    command: ["worker", "--interval", "14400"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

volumes:
  postgres_data:
