    enabled: true
    include_titles:
      - "Enterprise Automation Architect"
      - "Solutions Architect"
      - "Enterprise Solutions Architect"
      - "Business Systems Architect"
      - "Automation Architect"
    include_skills:
      - "automation"
      - "integrations"
      - "enterprise systems"
