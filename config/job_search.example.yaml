version: 1

global:
  enabled: true
  freshness_days: 7
  max_jobs_per_source_email: 100
  require_compensation: false
  target_compensation_usd_min: 150000
  compensation_basis: "confirm_base_vs_total_comp"

locations:
  include:
    - "Pittsburgh, PA"
    - "Remote - United States"
  include_radius_miles: []
  exclude: []

employment_types:
  include:
    - "full_time"
  exclude: []

hard_reject:
  title_keywords: []
  company_names: []
  clearance_requirements: []
  max_travel_percent: null

role_families:
